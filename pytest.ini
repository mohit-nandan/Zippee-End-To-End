[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    smoke: critical happy-path checks, runs daily
    sanity: core feature coverage, runs after every deployment
    regression: full suite, runs weekly or on-demand
    api: API layer tests
    web: Web dashboard tests
    mobile: Rider app mobile tests
    e2e: Full sequential end-to-end user journey (runs as one browser session)
addopts = --tb=short -v
